name: Build FreeBeat APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FreeBeat_Falas_Playlist_Background_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q FreeBeat_Falas_Playlist_Background_Project.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p FreeBeatAndroid assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeBeat-APK
          path: FreeBeatAndroid/app/build/outputs/apk/debug/app-debug.apk
