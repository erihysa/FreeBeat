name: Build ERiBeat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract Android project
        run: |
          unzip -o ERiBeat_Project_FIXED.zip -d ERiBeat_Project

      - name: Build APK
        run: gradle -p ERiBeat_Project assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ERiBeat-APK
          path: ERiBeat_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
